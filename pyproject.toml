[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-metadata-copilot"
version = "0.1.0"
description = "AI-native enterprise metadata intelligence platform"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "scripts", "tests"]
exclude = [".venv", "frontend", "backend/app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S101",   # assert is fine in tests
    "RUF012", # mutable class attrs without ClassVar
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"scripts/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "backend/app/db/migrations/versions|frontend"

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "(backend/app/db/migrations/versions|frontend)"

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: requires PostgreSQL and/or Neo4j",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/migrations/*"]
